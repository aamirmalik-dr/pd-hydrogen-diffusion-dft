[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdhdiff"
version = "0.2.0"
description = "Post-processing of CP-PAW density-functional calculations of hydrogen diffusion in fcc palladium: energy profile, transition-state theory, diffusion constant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aamir Malik" }]
keywords = ["density functional theory", "CP-PAW", "hydrogen diffusion", "palladium", "transition-state theory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.0", "pillow>=10.0"]
notebook = ["jupyter", "nbconvert", "ipykernel"]

[project.urls]
Repository = "https://github.com/aamirmalik-dr/pd-hydrogen-diffusion-dft"
"CP-PAW" = "https://cppaw.org"

[project.scripts]
pdhdiff = "pdhdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
